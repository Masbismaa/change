<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <style>
    .draw { stroke-dasharray: var(--l); stroke-dashoffset: var(--l); animation: draw var(--d, 1.2s) ease-out var(--s, 0s) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { 0% { transform: scale(0) rotate(-10deg); } 70% { transform: scale(1.08) rotate(3deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes sway { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-6px); } }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes hl { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.34,1.56,.64,1) var(--s, 0s) both; }
    .sway { transform-box: fill-box; transform-origin: top center; animation: sway 4.5s ease-in-out var(--s, 0s) infinite; }
    .fade { animation: fade .6s ease-out var(--s, 0s) both; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
    .hl { transform-box: fill-box; transform-origin: left; animation: hl .8s cubic-bezier(.6,.1,.2,1) var(--s, 0s) both; }
    @keyframes role { 0%, 2% { opacity: 0; transform: translateY(10px); } 6%, 30% { opacity: 1; transform: none; } 34%, 100% { opacity: 0; transform: translateY(-10px); } }
    .role { opacity: 0; animation: role 9s ease-in-out 1.6s infinite; }
    .r2 { animation-delay: 4.6s; } .r3 { animation-delay: 7.6s; }
  </style>
  <defs>
    <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="1">
        <animate attributeName="seed" values="1;4;7" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="3.5"/>
    </filter>
  </defs>
  <rect width="900" height="280" fill="#FBF7EE"/><line x1="0" y1="32" x2="900" y2="32" stroke="#D6E4F2" stroke-width="1.2"/><line x1="0" y1="64" x2="900" y2="64" stroke="#D6E4F2" stroke-width="1.2"/><line x1="0" y1="96" x2="900" y2="96" stroke="#D6E4F2" stroke-width="1.2"/><line x1="0" y1="128" x2="900" y2="128" stroke="#D6E4F2" stroke-width="1.2"/><line x1="0" y1="160" x2="900" y2="160" stroke="#D6E4F2" stroke-width="1.2"/><line x1="0" y1="192" x2="900" y2="192" stroke="#D6E4F2" stroke-width="1.2"/><line x1="0" y1="224" x2="900" y2="224" stroke="#D6E4F2" stroke-width="1.2"/><line x1="0" y1="256" x2="900" y2="256" stroke="#D6E4F2" stroke-width="1.2"/><line x1="44" y1="0" x2="44" y2="280" stroke="#F1A6A0" stroke-width="2"/>
  <g filter="url(#boil)">
    <path class="draw" style="--l:1200;--d:1.4s" d="M70 26 Q 300 20, 560 24 T 870 30 L 866 250 Q 600 256, 320 250 T 74 246 Z" fill="none" stroke="#1F2A44" stroke-width="3" stroke-linecap="round"/>
    <path class="draw" style="--l:520;--d:1s;--s:.8s" d="M112 202 C 240 186, 400 214, 560 196 S 640 192, 660 198" fill="none" stroke="#FF7A59" stroke-width="5" stroke-linecap="round"/>
    <g class="spin"><path d="M800 60 l7 18 19 1 -15 12 5 19 -16 -11 -16 11 5 -19 -15 -12 19 -1z" fill="#FFE45C" stroke="#1F2A44" stroke-width="2.5" stroke-linejoin="round"/></g>
    <g class="sway" style="--s:.4s"><rect x="720" y="130" width="120" height="100" fill="#CFEFFF" stroke="#1F2A44" stroke-width="2"/><rect x="752" y="120" width="56" height="18" fill="rgba(210,196,160,.7)"/>
      <text x="780" y="170" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Marker Felt','Bradley Hand',cursive" font-size="17" fill="#1F2A44">to do:</text>
      <text x="780" y="194" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Marker Felt','Bradley Hand',cursive" font-size="15" fill="#1F2A44">django, flask</text>
      <text x="780" y="214" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Marker Felt','Bradley Hand',cursive" font-size="15" fill="#1F2A44">+ tidur</text></g>
    <path class="draw" style="--l:160;--s:1.8s" d="M700 206 C 680 240, 640 240, 620 226 M630 214 L 618 228 L 636 234" fill="none" stroke="#2F5BD3" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="fade" style="--s:.2s"><text x="110" y="78" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Marker Felt','Bradley Hand',cursive" font-size="22" fill="#FF7A59" transform="rotate(-2 110 78)">halo, ini buku catatanku</text></g>
  <g class="fade" style="--s:.5s"><text x="110" y="148" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Marker Felt','Bradley Hand',cursive" font-size="46" font-weight="700" fill="#1F2A44">Mochammad Bisma Prasetya</text></g>
  <g font-size="22" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Marker Felt','Bradley Hand',cursive" fill="#2F5BD3">
    <text x="112" y="236" class="role">Full Stack Developer</text>
    <text x="112" y="236" class="role r2">Django / Flask / PostgreSQL</text>
    <text x="112" y="236" class="role r3">ngoding ALR, satu milestone sekali jalan</text>
  </g>
</svg>
