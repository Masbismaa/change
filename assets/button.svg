<svg xmlns="http://www.w3.org/2000/svg" width="900" height="124" viewBox="0 0 900 124">
  <style>
    .draw { stroke-dasharray: var(--l); stroke-dashoffset: var(--l); animation: draw var(--d, 1.2s) ease-out var(--s, 0s) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { 0% { transform: scale(0) rotate(-10deg); } 70% { transform: scale(1.08) rotate(3deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes sway { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-6px); } }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes hl { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.34,1.56,.64,1) var(--s, 0s) both; }
    .sway { transform-box: fill-box; transform-origin: top center; animation: sway 4.5s ease-in-out var(--s, 0s) infinite; }
    .fade { animation: fade .6s ease-out var(--s, 0s) both; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
    .hl { transform-box: fill-box; transform-origin: left; animation: hl .8s cubic-bezier(.6,.1,.2,1) var(--s, 0s) both; }
    @keyframes nudge { 0%, 70%, 100% { transform: rotate(0) scale(1); } 76% { transform: rotate(-2deg) scale(1.03); } 82% { transform: rotate(1.5deg) scale(1.02); } 88% { transform: rotate(0) scale(1); } }
    .nudge { transform-box: fill-box; transform-origin: center; animation: nudge 3.4s ease-in-out infinite; }
    @keyframes arrow { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
    .arrow { animation: arrow 1.1s ease-in-out infinite; }
  </style>
  <defs>
    <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="1">
        <animate attributeName="seed" values="1;4;7" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="3.5"/>
    </filter>
  </defs>
  <rect width="900" height="124" fill="#FBF7EE"/><line x1="0" y1="32" x2="900" y2="32" stroke="#D6E4F2" stroke-width="1.2"/><line x1="0" y1="64" x2="900" y2="64" stroke="#D6E4F2" stroke-width="1.2"/><line x1="0" y1="96" x2="900" y2="96" stroke="#D6E4F2" stroke-width="1.2"/><line x1="0" style="display:none" y1="0" x2="44" y2="124" stroke="#F1A6A0" stroke-width="2"/>
  <g class="nudge">
    <g filter="url(#boil)"><path d="M150 26 Q 450 18, 752 28 L 748 100 Q 450 108, 154 98 Z" fill="#FFE45C" stroke="#1F2A44" stroke-width="3"/></g>
    <text x="440" y="74" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Marker Felt','Bradley Hand',cursive" font-size="30" font-weight="700" fill="#1F2A44">buka portfolio interaktif</text>
    <g class="arrow" filter="url(#boil)"><path d="M660 64 h52 M696 48 l16 16 -16 16" fill="none" stroke="#1F2A44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <text x="770" y="40" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Marker Felt','Bradley Hand',cursive" font-size="18" fill="#FF7A59" transform="rotate(8 770 40)">klik!</text>
</svg>
