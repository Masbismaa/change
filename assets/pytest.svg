<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <style>
    .draw { stroke-dasharray: var(--l); stroke-dashoffset: var(--l); animation: draw var(--d, 1.2s) ease-out var(--s, 0s) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { 0% { transform: scale(0) rotate(-10deg); } 70% { transform: scale(1.08) rotate(3deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes sway { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-6px); } }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes hl { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.34,1.56,.64,1) var(--s, 0s) both; }
    .sway { transform-box: fill-box; transform-origin: top center; animation: sway 4.5s ease-in-out var(--s, 0s) infinite; }
    .fade { animation: fade .6s ease-out var(--s, 0s) both; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
    .hl { transform-box: fill-box; transform-origin: left; animation: hl .8s cubic-bezier(.6,.1,.2,1) var(--s, 0s) both; }
    @keyframes cyc { 0%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .cyc { animation: cyc 11s linear infinite; }
    @keyframes t0 { 0%, 8% { stroke-dashoffset: 60; } 11%, 100% { stroke-dashoffset: 0; } }
    .t0 { stroke-dasharray: 60; stroke-dashoffset: 60; animation: t0 11s ease-out infinite; }
    @keyframes t1 { 0%, 14% { stroke-dashoffset: 60; } 17%, 100% { stroke-dashoffset: 0; } }
    .t1 { stroke-dasharray: 60; stroke-dashoffset: 60; animation: t1 11s ease-out infinite; }
    @keyframes t2 { 0%, 20% { stroke-dashoffset: 60; } 23%, 100% { stroke-dashoffset: 0; } }
    .t2 { stroke-dasharray: 60; stroke-dashoffset: 60; animation: t2 11s ease-out infinite; }
    @keyframes t3 { 0%, 26% { stroke-dashoffset: 60; } 29%, 100% { stroke-dashoffset: 0; } }
    .t3 { stroke-dasharray: 60; stroke-dashoffset: 60; animation: t3 11s ease-out infinite; }
    @keyframes t4 { 0%, 32% { stroke-dashoffset: 60; } 35%, 100% { stroke-dashoffset: 0; } }
    .t4 { stroke-dasharray: 60; stroke-dashoffset: 60; animation: t4 11s ease-out infinite; }
    @keyframes t5 { 0%, 38% { stroke-dashoffset: 60; } 41%, 100% { stroke-dashoffset: 0; } }
    .t5 { stroke-dasharray: 60; stroke-dashoffset: 60; animation: t5 11s ease-out infinite; }
    @keyframes t6 { 0%, 44% { stroke-dashoffset: 60; } 47%, 100% { stroke-dashoffset: 0; } }
    .t6 { stroke-dasharray: 60; stroke-dashoffset: 60; animation: t6 11s ease-out infinite; }
    @keyframes stamp { 0%, 52% { transform: scale(0) rotate(-12deg); opacity: 0; } 56% { transform: scale(1.15) rotate(-8deg); opacity: 1; } 60%, 94% { transform: scale(1) rotate(-8deg); opacity: 1; } 100% { opacity: 0; } }
    .stamp { transform-box: fill-box; transform-origin: center; animation: stamp 11s ease-out infinite; }
  </style>
  <defs>
    <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="1">
        <animate attributeName="seed" values="1;4;7" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="3.5"/>
    </filter>
  </defs>
